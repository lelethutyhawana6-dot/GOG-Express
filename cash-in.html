<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Cash-In | GOG Payroll</title>

<link rel="stylesheet" href="../css/cash-in.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script type="module" src="../js/cash-in.js" defer></script>

</head>

<body>

<header>

<a href="dashboard.html" class="backBtn">

← Dashboard

</a>

<h1>💵 Daily Cash-In</h1>

<p>Record today's runner cash-in.</p>

</header>

<main>

<section class="cashCard">

<h2>Cash-In Details</h2>

<form id="cashForm">

<label>Runner</label>

<select id="runner" required>

<option value="">Select Runner</option>

</select>

<label>Date</label>

<input
type="date"
id="date"
required>

<label>Float Given (R)</label>

<input
type="number"
id="float"
placeholder="0.00"
required>

<label>Cash Returned (R)</label>

<input
type="number"
id="cashReturned"
placeholder="0.00"
required>

<label>Vendor Cost (R)</label>

<input
type="number"
id="vendorCost"
placeholder="0.00"
required>

<label>Orders Made</label>

<input
type="number"
id="orders"
placeholder="0"
required>

<label>Quest Bonus (R)</label>

<input
type="number"
id="questInput"
placeholder="0"
value="0">

<label>Other Expenses (R)</label>

<input
type="number"
id="expenses"
placeholder="0.00"
value="0">

<button type="submit">

Calculate & Save

</button>

</form>

</section>

<section class="resultsCard">

<h2>Today's Calculation</h2>

<div class="result">

<span>Profit</span>

<strong id="profit">

R0.00

</strong>

</div>

<div class="result">

<span>Runner 20%</span>

<strong id="commission">

R0.00

</strong>

</div>

<div class="result">

<span>Quest Bonus</span>

<strong id="quest">

R0.00

</strong>

</div>

<div class="result">

<span>Runner Total</span>

<strong id="runnerTotal">

R0.00

</strong>

</div>

<div class="result">

<span>GOG Earnings</span>

<strong id="gogTotal">

R0.00

</strong>

</div>

</section>

</main>

</body>

</html>
